[General]
;spring-damper physics
fImpulse=50.0            ;base impulse force on hit
fStiffness=156.0         ;spring return force (higher=snappier)
fDamping=8.0             ;oscillation damping (higher=less bounce)
fDecay=3.0               ;how fast the reaction fades

;rotation axis weights
fPitchScale=1.0          ;forward/backward
fRollScale=0.7           ;side tilt
fYawScale=0.3            ;left/right turn

;clamp limits
fMaxDeg=25.0             ;max body rotation degrees
fMaxHeadDeg=35.0         ;max head rotation degrees

;limb weights - passive = non-hit side, hit = directly struck
fArmMult=2.0             ;overall arm impulse multiplier
fArmPassive=0.4
fForearmPassive=0.7
fArmHit=1.3
fForearmHit=1.6
fClavicleHit=0.7
fLegMult=2.0             ;overall leg impulse multiplier
fThighPassive=0.2
fCalfPassive=0.1
fThighHit=1.25
fCalfHit=0.9
fPelvisHit=0.65
fKneeBuckleMult=1.25
fHeadFollow=0.2          ;head sway on non-head hits (0=none, 1=full)

fCullDist=4096.0         ;skip reactions beyond this distance from camera
bAffectPlayer=0

[Variation]
fReactionChance=0.98     ;chance any hit produces a reaction (skip system handles filtering)
fSkipChance=0.35         ;chance to skip weak non-head hits below fSkipThreshold
fHeadSkipChance=0.10     ;chance to skip weak head hits below fSkipThreshold
fSkipThreshold=0.10      ;damage below this % of max HP is "weak"
fHitCooldown=0.18        ;seconds before the same actor can take another reaction impulse
fHPFloor=0.20            ;minimum hpFactor so even weak hits produce some reaction
fRandomMin=0.55          ;impulse random multiplier range
fRandomMax=1.40
fArmorAbsorb=0.5         ;how much armor reduces reaction (0=ignore, 1=full)
fRefDmg=50.0             ;weapon base damage that produces a "full" reaction
fHPCap=200.0             ;cap effective HP so tanky enemies still flinch

[Posture]
bEnablePosture=0         ;NPCs hunch over as they take damage
fPostureMaxDeg=15.0

[Death]
bEnableDeathTremor=1
bEnablePostDeathTremor=1 ;tremor on corpses that died without a primed hit
fPostDeathTremorDuration=2.4
fPostDeathTremorMult=1.0
fDeathTremorDuration=2.4 ;seconds
fDeathTremorStrength=5.0
fDeathTremorChance=1.0
fDeathTremorDelayMin=0.16 ;delay before tremor starts (lets ragdoll settle)
fDeathTremorDelayMax=0.24
